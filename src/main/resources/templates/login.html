<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 夜市临时用电与跳闸追责平台</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <h1>🏮 夜市临时用电<br><span class="muted" style="font-size:14px">申请 · 加电 · 跳闸追责一体化平台</span></h1>
    <div th:if="${param.error}" class="err" style="margin:10px 0">用户名或密码错误</div>
    <div th:if="${param.logout}" class="ok" style="margin:10px 0">已退出登录</div>
    <form method="post" th:action="@{/login}">
      <label>用户名</label>
      <input name="username" placeholder="如 admin01" autofocus required>
      <label>密码</label>
      <input name="password" type="password" placeholder="night123" required>
      <button type="submit" style="width:100%">登 录</button>
    </form>
    <hr style="border-color:var(--line);margin:16px 0">
    <div class="accounts">
      <div style="color:var(--text);margin-bottom:6px">演示账号（密码统一 <code>night123</code>）：</div>
      <div><code>admin01</code> 市场管理员林芳 · 审批/追责/风控/闭市</div>
      <div><code>electrician01</code> 电工马强 · 接线/故障确认/复检</div>
      <div><code>vendor01</code> 摊主王建军（明火高风险 A01）</div>
      <div><code>vendor02</code> 摊主李桂兰（A02 已送电）</div>
      <div><code>vendor04</code> 摊主陈美玲（B01/B02 一摊主持两摊）</div>
      <div><code>security01</code> 安保赵虎 · 报险/到场</div>
      <div><code>cashier01</code> 收费孙倩 · 预付电费/欠费断电</div>
      <div><code>fire01</code> 消防郑刚 · 消防抽检</div>
    </div>
  </div>
</div>
</body>
</html>
