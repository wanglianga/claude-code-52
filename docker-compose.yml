services:
  app:
    build: .
    image: night-market-power:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nightmarket}-app
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      DEMO_RESET_ON_START: "true"
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nightmarket}-redis
    # 依赖服务不发布到宿主端口，仅在 compose 内部网络互访
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
